<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>[cps-blog]鼠标跟随icon效果</title>

        <script src="/asset/js/gsap@3.13.0/CustomEase.min.js"></script>
        <script src="/asset/js/gsap@3.13.0/gsap.min.js"></script>
        <script src="/asset/icons/skill-icons/import-skill-icons-data.js"></script>
        <script type="module">
            import { MouseTracker } from "/asset/js/esm/[cps-blog]鼠标跟随icon效果.js";
            gsap.registerPlugin(CustomEase);

            console.log(CPS_SCRIPTS);

            const mouseTracker = new MouseTracker(document.body, {
                threshold: 120,
                count: 60,
                parentId: "",
                DEBUG: false,
                iconsList: CPS_SCRIPTS.skillIcons,
                size: 26,
                iconPath: "/asset/icons/skill-icons/",
            });

            mouseTracker.addTrackerToMouseMove();
        </script>
    </head>
    <body></body>
</html>
