<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>原生 JavaScript 终端</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Courier New", monospace;
                background-color: #1e1e1e;
                color: #fff;
                min-height: 100vh;
                padding: 20px;
            }

            #terminal {
                background-color: #0c0c0c;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
                max-width: 800px;
                margin: 0 auto;
            }

            #terminal-titlebar {
                background-color: #333;
                height: 30px;
                display: flex;
                align-items: center;
                padding: 0 15px;
                color: #aaa;
                font-size: 12px;
            }

            #terminal-body {
                background-color: #0c0c0c;
                padding: 20px;
                height: 500px;
                overflow-y: auto;
                line-height: 1.5;
            }

            .posted {
                color: #00ff00;
                margin-bottom: 5px;
                white-space: pre-wrap;
                word-wrap: break-word;
            }

            #commandline {
                display: flex;
                align-items: center;
                margin-top: 10px;
            }

            .prompt {
                color: #fff;
                background: transparent;
                border: none;
                outline: none;
                font-family: "Courier New", monospace;
                font-size: 16px;
                flex: 1;
                padding: 0 5px;
            }

            .prompt-label {
                color: #00ffff;
            }
        </style>
    </head>
    <body>
        <div id="terminal">
            <div id="terminal-titlebar">终端</div>
            <div id="terminal-body">
                <div class="posted">欢迎使用原生 JavaScript 终端！输入 "help" 查看可用命令。</div>
            </div>
        </div>

        <script>
            class Terminal {
                constructor() {
                    this.history = [];
                    this.commands = {
                        help: "显示命令列表，或获取特定命令的帮助。(语法: 'help [参数]')",
                        clear: "清除终端中的所有内容。",
                        color: "更改终端文本颜色。(语法: 'color [颜色]')",
                        bgcolor: "更改终端背景颜色。(语法: 'bgcolor [颜色]')",
                        wincolor: "更改窗口背景颜色。(语法: 'wincolor [颜色]')",
                        dir: "显示数据库中的文件列表",
                        read: "显示文件内容 (语法: 'read [文件名]')",
                        write: "将内容写入文件 (语法: 'write [文件名] [内容]')",
                        del: "从数据库中删除文件 (语法: 'del [文件名]')",
                        run: "将存储的文件解释为 JavaScript 代码 (语法: 'run [文件名]')",
                        echo: "直接在终端中输出文本 (语法: 'echo [文本]')",
                        rps: "玩一轮石头剪刀布 (语法: 'rps [rock/paper/scissors]')",
                    };

                    this.files = {
                        "hello.txt": "Hello world!",
                        "nietzsche.txt": "To live is to suffer, to survive is to find some meaning in the suffering.",
                    };

                    this.initialize();
                }

                initialize() {
                    this.terminalBody = document.getElementById("terminal-body");
                    this.terminal = document.getElementById("terminal");

                    this.createCommandLine();
                    this.setupEventListeners();
                    this.focusInput();
                }

                createCommandLine() {
                    const commandLine = document.createElement("div");
                    commandLine.id = "commandline";
                    commandLine.innerHTML = `
                    <span class="prompt-label">C:\\></span>
                    <input type="text" class="prompt" autocomplete="off">
                `;
                    this.terminalBody.appendChild(commandLine);
                    this.promptInput = commandLine.querySelector(".prompt");
                }

                setupEventListeners() {
                    // 输入框按键事件
                    this.promptInput.addEventListener("keyup", (e) => {
                        if (e.key === "Enter") {
                            this.handleCommand();
                        }
                    });

                    // 点击终端聚焦输入框
                    this.terminal.addEventListener("click", () => {
                        this.focusInput();
                    });

                    // 全局按键事件聚焦输入框
                    document.addEventListener("keydown", (e) => {
                        if ((!e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) || e.key === "Enter" || e.key === "Backspace") {
                            this.focusInput();
                        }
                    });

                    // 防止Ctrl+A等操作导致失焦
                    document.addEventListener("keydown", (e) => {
                        if (e.ctrlKey && e.key === "a") {
                            e.preventDefault();
                            this.promptInput.select();
                        }
                    });
                }

                handleCommand() {
                    const input = this.promptInput.value.trim();
                    if (!input) return;

                    this.log(`C:\\> ${input}`);
                    this.promptInput.value = "";

                    const args = input.split(" ");
                    this.executeCommand(args[0], args.slice(1));

                    this.scrollToBottom();
                }

                log(message) {
                    const entry = document.createElement("div");
                    entry.className = "posted";
                    entry.textContent = message;
                    this.terminalBody.appendChild(entry);
                    this.history.push(message);
                }

                clear() {
                    this.terminalBody.innerHTML = "";
                    this.history = [];
                    this.createCommandLine();
                    this.focusInput();
                }

                focusInput() {
                    if (this.promptInput) {
                        this.promptInput.focus();
                    }
                }

                scrollToBottom() {
                    this.terminalBody.scrollTop = this.terminalBody.scrollHeight;
                }

                readFile(fileName) {
                    if (this.files[fileName] !== undefined) {
                        return this.files[fileName];
                    } else {
                        throw new Error(`文件 '${fileName}' 未找到。`);
                    }
                }

                writeFile(name, contents) {
                    this.files[name] = contents;
                }

                executeCommand(command, args) {
                    const argc = args.length;
                    const argv = [command, ...args];

                    switch (command.toLowerCase()) {
                        case "clear":
                            this.clear();
                            console.clear();
                            break;

                        case "help":
                            if (argc < 1) {
                                this.log("可用命令: " + Object.keys(this.commands).join(", "));
                            } else {
                                if (args[0] in this.commands) {
                                    this.log(`${args[0]}: ${this.commands[args[0]]}`);
                                } else {
                                    this.log(`命令 '${args[0]}' 不存在。`);
                                }
                            }
                            break;

                        case "color":
                            if (argc < 1) {
                                this.log("错误: 未指定颜色。");
                            } else {
                                this.terminalBody.style.color = args[0];
                                this.log(`已将文本颜色设置为 ${args[0]}`);
                            }
                            break;

                        case "bgcolor":
                            if (argc < 1) {
                                this.log("错误: 未指定颜色。");
                            } else {
                                this.terminalBody.style.backgroundColor = args[0];
                                this.log(`已将终端背景颜色设置为 ${args[0]}`);
                            }
                            break;

                        case "wincolor":
                            if (argc < 1) {
                                this.log("错误: 未指定颜色。");
                            } else {
                                document.body.style.backgroundColor = args[0];
                                this.log(`已将窗口背景颜色设置为 ${args[0]}`);
                            }
                            break;

                        case "dir":
                            const fileNames = Object.keys(this.files);
                            if (fileNames.length < 1) {
                                this.log("没有文件。");
                            } else {
                                this.log(fileNames.join(", "));
                            }
                            break;

                        case "read":
                            try {
                                this.log(this.readFile(args[0]));
                            } catch (e) {
                                this.log(e.message);
                            }
                            break;

                        case "write":
                            if (argc < 1) {
                                this.log("错误: 未指定文件名。");
                            } else if (argc < 2) {
                                this.log("错误: 未指定文件内容。");
                            } else {
                                const fileName = args[0];
                                const fileContents = args.slice(1).join(" ");
                                this.writeFile(fileName, fileContents);
                                this.log(`已写入文件 ${fileName}`);
                            }
                            break;

                        case "run":
                            try {
                                this.log("执行程序 '" + args[0] + "'...");
                                const code = this.readFile(args[0]);
                                const result = eval(code);
                                this.log(result !== undefined ? result.toString() : "已执行");
                            } catch (e) {
                                this.log("执行错误: " + e.message);
                            }
                            break;

                        case "del":
                            if (args[0] in this.files) {
                                delete this.files[args[0]];
                                this.log("已删除 " + args[0]);
                            } else {
                                this.log("错误: 文件未找到。");
                            }
                            break;

                        case "echo":
                            if (argc < 1) {
                                this.log("错误: 未指定要输出的内容。");
                            } else {
                                this.log(args.join(" "));
                            }
                            break;

                        case "rps":
                            if (argc < 1) {
                                this.log("未指定选择。(语法: rps [rock/paper/scissors])");
                                break;
                            }

                            const playerChoice = args[0].toLowerCase();
                            this.log("你选择了: " + playerChoice);

                            let cpuChoice = Math.random();
                            cpuChoice = cpuChoice <= 0.33 ? "rock" : cpuChoice <= 0.66 ? "paper" : "scissors";
                            this.log("CPU 选择了: " + cpuChoice);

                            switch (playerChoice) {
                                case "rock":
                                    if (cpuChoice === "rock") this.log("平局！");
                                    else if (cpuChoice === "paper") this.log("CPU 赢了。");
                                    else this.log("你赢了！");
                                    break;
                                case "paper":
                                    if (cpuChoice === "paper") this.log("平局！");
                                    else if (cpuChoice === "rock") this.log("你赢了！");
                                    else this.log("CPU 赢了。");
                                    break;
                                case "scissors":
                                    if (cpuChoice === "scissors") this.log("平局！");
                                    else if (cpuChoice === "rock") this.log("CPU 赢了。");
                                    else this.log("你赢了！");
                                    break;
                                default:
                                    this.log("无效选择。(语法: rps [rock/paper/scissors])");
                                    break;
                            }
                            break;

                        default:
                            this.log(`命令 '${command}' 不存在。输入 "help" 查看可用命令。`);
                            break;
                    }

                    this.scrollToBottom();
                }
            }

            // 初始化终端
            document.addEventListener("DOMContentLoaded", () => {
                window.terminal = new Terminal();
            });
        </script>
    </body>
</html>
